[package]
name = "worxide"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys        = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
tokio = { version = "1", features = ["sync"], default-features = false }

[profile.release]
opt-level = 3
lto       = true