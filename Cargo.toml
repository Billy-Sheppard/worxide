[package]
name = "worxide"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
js-sys = "0.3.98"
linkme = "0.3.36"
serde = "1.0.228"
serde_json = "1.0.149"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Blob",
    "BlobPropertyBag",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Url",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
] }

console_error_panic_hook = { optional = true, version = "0.1.7" }
gloo = { optional = true, version = "0.12.0" }
getrandom = { optional = true, version = "0.4.2", default-features = false, features = [
    "wasm_js",
] }
rand = { optional = true, version = "0.10.1", default-features = false, features = [
    "thread_rng",
] }

[features]
default = []
example = ["console_error_panic_hook", "gloo", "getrandom", "rand"]
