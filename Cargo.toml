[package]
name = "worxide"
version = "0.0.2"
edition = "2024"

description = "Fast WASM Workers"
documentation = "https://docs.rs/worxide/latest/worxide/"
homepage = "https://billy-sheppard.github.io/worxide/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Billy-Sheppard/worxide"

[dependencies]
anyhow = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[profile.release]
opt-level = 3
lto = true

[workspace]
resolver = "3"
members = ["worxide-example"]

[workspace.dependencies]
anyhow = "1.0.102"
js-sys = "0.3.99"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = [ "Blob", "BlobPropertyBag", "MessageEvent", "Url", "Worker", "WorkerGlobalScope", "WorkerOptions", "WorkerType"] }
