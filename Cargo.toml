[package]
name = "worxide"
version = "0.0.9"
edition = "2024"
rust-version = "1.85"

description = "Fast WASM Workers"
documentation = "https://docs.rs/worxide/latest/worxide/"
homepage = "https://billy-sheppard.github.io/worxide/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Billy-Sheppard/worxide"

[dependencies]
anyhow = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[profile.release]
opt-level = 3
lto = true

[features]
default = []
rayon = ["dep:rayon"]

[dependencies.rayon]
version = "1.11"
optional = true

[workspace]
resolver = "3"
members = ["worxide-example"]

[workspace.dependencies]
anyhow = "1.0.104"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Blob",
    "BlobPropertyBag",
    "EventTarget",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Url",
    "Worker",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WorkerOptions",
    "WorkerType",
] }
