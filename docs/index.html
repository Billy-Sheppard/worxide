<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="worxide.png">

  <title>worxide</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

  <style>
    html {
      width: 100%;
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      height: auto;
      margin: 0;
      overflow: visible;
    }

    body>.section {
      min-height: 100vh;
      height: auto;
      overflow: visible;
    }

    .benchmark-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .benchmark-grid>.box {
      min-width: 0;
      margin: 0;
    }

    .benchmark-grid pre {
      margin-top: 1rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .fading-text {
      animation: fade 0.75s infinite alternate;
    }

    @keyframes fade {
      from {
        color: #fff;
      }

      to {
        color: #808080;
      }
    }

    @media (max-width: 1000px) {
      .benchmark-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    (async () => {
      if (self.crossOriginIsolated) return;
      if (!('serviceWorker' in navigator)) return;
      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      location.reload();
    })();
  </script>
</head>

<body>
  <script type="module">
    import init, { run_app } from './worxide_example.js';

    if (self.crossOriginIsolated) {
      await init();
      await run_app();
    }
  </script>
</body>

</html>
